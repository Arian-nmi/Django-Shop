services:
  db:
    container_name: db
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - 5432
    restart: always

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./Dockerfiles/dev/Dockerfile
    volumes:
      - ./core:/usr/src/app
    working_dir: /usr/src/app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 8000:8000
    environment:
      - DEBUG=True
    env_file:
      - ./envs/dev/.env
    restart: always
    depends_on:
      - db
      - redis
      
  celery-worker:
    container_name: celery-worker
    build:
      context: .
      dockerfile: ./Dockerfiles/dev/Dockerfile
    volumes:
      - ./core:/usr/src/app
    working_dir: /usr/src/app
    command: celery -A core worker -l INFO
    env_file:
      - ./envs/dev/.env
    restart: always
    depends_on:
      - db
      - redis
      - smtp4dev

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - '5000:80'
      - '25:25'
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__HostName=smtp4dev

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - 6379
    restart: always

volumes:
  smtp4dev-data:
  postgres_data:
  redis_data: