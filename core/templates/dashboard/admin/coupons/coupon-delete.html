{% extends "base.html" %}

{% block title %}
    حذف کد تخفیف
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card border-danger">
        <div class="card-body">
            <h1 class="h4 text-danger">
                حذف کد تخفیف
            </h1>

            <p>
                آیا از حذف کد تخفیف
                <strong>{{ object.code }}</strong>
                مطمئن هستید؟
            </p>

            <form method="post">
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    بله، حذف شود
                </button>

                <a
                    href="{% url 'dashboard:admin:coupon-edit' object.id %}"
                    class="btn btn-outline-secondary"
                >
                    انصراف
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
