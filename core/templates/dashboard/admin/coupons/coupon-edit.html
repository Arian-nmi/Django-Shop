{% extends "base.html" %}

{% block title %}
    ویرایش کد تخفیف
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h1 class="h3">
            ویرایش {{ object.code }}
        </h1>

        <a
            href="{% url 'dashboard:admin:coupon-list' %}"
            class="btn btn-outline-secondary"
        >
            بازگشت
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label
                            for="{{ field.id_for_label }}"
                            class="form-label"
                        >
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    ذخیره تغییرات
                </button>

                <a
                    href="{% url 'dashboard:admin:coupon-delete' object.id %}"
                    class="btn btn-outline-danger"
                >
                    حذف کد تخفیف
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
