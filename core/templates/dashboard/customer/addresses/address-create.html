{% extends "base.html" %}

{% block title %}ثبت آدرس{% endblock %}

{% block content %}
<div class="container py-5">
    <h1>ثبت آدرس جدید</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            ثبت آدرس
        </button>

        <a
            href="{% url 'dashboard:customer:address-list' %}"
            class="btn btn-secondary"
        >
            بازگشت
        </a>
    </form>
</div>
{% endblock %}
