{% extends "base.html" %}

{% block title %}حذف آدرس{% endblock %}

{% block content %}
<div class="container py-5">
    <h1>حذف آدرس</h1>

    <p>
        آیا از حذف این آدرس مطمئن هستید؟
    </p>

    <p>
        {{ object.state }}،
        {{ object.city }}،
        {{ object.address }}
    </p>

    <form method="post">
        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger"
        >
            بله، حذف شود
        </button>

        <a
            href="{% url 'dashboard:customer:address-list' %}"
            class="btn btn-secondary"
        >
            انصراف
        </a>
    </form>
</div>
{% endblock %}
