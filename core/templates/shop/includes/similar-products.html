{% load static %}
<div class="mb-3">
  <h4>محصولات مشابه</h4>
</div>
<div class="row g-4">
  {% for product in products %}
    <div class="col-sm-6 col-lg-3">
      <article class="card h-100">
        <img class="card-img-top" src="{{ product.image.url }}" alt="{{ product.title }}">
        <div class="card-body">
          <span class="badge bg-primary mb-2">{{ product.get_price }} تومان</span>
          <h5 class="h6"><a href="{% url 'shop:product-detail' slug=product.slug %}" class="text-dark">{{ product.title }}</a></h5>
        </div>
      </article>
    </div>
  {% empty %}
    <p class="text-muted">محصول مشابهی پیدا نشد.</p>
  {% endfor %}
</div>
